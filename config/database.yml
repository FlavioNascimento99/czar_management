# SQLite. Versions 3.8.0 and up are supported.
#   gem install sqlite3
#
#   Ensure the SQLite 3 gem is defined in your Gemfile
#   gem "sqlite3"
#
default: &default
  adapter: sqlite3
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
  timeout: 5000

development:
  <<: *default
  database: storage/development.sqlite3

# Warning: The database defined as "test" will be erased and
# re-generated from your development database when you run "rake".
# Do not set this db to the same as development or production.
test:
  <<: *default
  database: storage/test.sqlite3

# Production runs on Postgres (Supabase) because Cloudflare Containers have
# ephemeral disk — SQLite files would not survive restarts. Solid Cache, Queue
# and Cable live in this same database (tables created by regular migrations).
# Use the Supavisor SESSION pooler (port 5432): the direct db.<ref>.supabase.co
# host is IPv6-only, and the transaction pooler (port 6543) breaks Solid Queue
# advisory locks.
# Example: postgres://postgres.<ref>:PASSWORD@aws-0-<region>.pooler.supabase.com:5432/postgres?sslmode=require
production:
  adapter: postgresql
  encoding: unicode
  url: <%= ENV["DATABASE_URL"] %>
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>
